name: FinCloud CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: fincloud-cluster
  PROJECT_NAME: fincloud

permissions:
  contents: read
  id-token: write

jobs:
  # ===========================================================================
  # Stage 1: Code Quality and Tests
  # ===========================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, transaction-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          cd services/${{ matrix.service }}
          ruff check app/ --select E,W,F --ignore E501

      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: test-secret-key

  # ===========================================================================
  # Stage 2: Security Scanning
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit (SAST)
        run: |
          bandit -r services/user-service/app/ -f json -o bandit-user.json --severity-level medium || true
          bandit -r services/transaction-service/app/ -f json -o bandit-txn.json --severity-level medium || true
          bandit -r services/fraud-service/ -f json -o bandit-fraud.json --severity-level medium || true
          echo "Security scan complete"

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r services/user-service/requirements.txt
          safety check --output json || true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: bandit-*.json

  # ===========================================================================
  # Stage 3: Docker Build and Push to ECR
  # ===========================================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: user-service
            ecr_repo: fincloud-user-service
          - service: transaction-service
            ecr_repo: fincloud-transaction-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          cd services/${{ matrix.service }}
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest

  # ===========================================================================
  # Stage 4: Terraform Infrastructure Deployment
  # ===========================================================================
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

  # ===========================================================================
  # Stage 5: ECS Service Deployment
  # ===========================================================================
  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build-and-push, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update User Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PROJECT_NAME }}-user-service \
            --force-new-deployment

      - name: Update Transaction Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PROJECT_NAME }}-transaction-service \
            --force-new-deployment

      - name: Wait for services to stabilize
        run: |
          echo "Waiting for user-service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_NAME }}-user-service \
            --timeout 300 || true

          echo "Waiting for transaction-service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_NAME }}-transaction-service \
            --timeout 300 || true

      - name: Health check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ${{ env.PROJECT_NAME }}-alb \
            --query 'LoadBalancers[0].DNSName' --output text)

          echo "ALB DNS: $ALB_DNS"

          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/api/v1/users/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ User service healthy"
              break
            fi
            echo "Attempt $i: status=$STATUS, retrying..."
            sleep 10
          done

          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/api/v1/transactions/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Transaction service healthy"
              break
            fi
            echo "Attempt $i: status=$STATUS, retrying..."
            sleep 10
          done

  # ===========================================================================
  # Stage 6: Post-Deploy Monitoring Check
  # ===========================================================================
  post-deploy:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: deploy-ecs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify CloudWatch alarms
        run: |
          aws cloudwatch describe-alarms \
            --alarm-name-prefix ${{ env.PROJECT_NAME }} \
            --query 'MetricAlarms[].{Name:AlarmName,State:StateValue}' \
            --output table

      - name: Check ECS task status
        run: |
          aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --query 'taskArns' --output table

      - name: Deployment summary
        run: |
          echo "============================================"
          echo " FinCloud Deployment Complete"
          echo "============================================"
          echo " Commit: ${{ github.sha }}"
          echo " Branch: ${{ github.ref_name }}"
          echo " Time:   $(date -u)"
          echo "============================================"
