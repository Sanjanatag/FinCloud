version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fincloud
      POSTGRES_USER: fincloud
      POSTGRES_PASSWORD: fincloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/db_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs,dynamodb,secretsmanager
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fincloud:fincloud@postgres:5432/fincloud
      JWT_SECRET_KEY: local-dev-secret-key
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  transaction-service:
    build:
      context: ../services/transaction-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://fincloud:fincloud@postgres:5432/fincloud
      JWT_SECRET_KEY: local-dev-secret-key
      SQS_QUEUE_URL: http://localstack:4566/000000000000/fincloud-transactions
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  pgdata:
